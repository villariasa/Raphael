<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      /* Raphael's Celestial Human-like AI Cursor */
      #raph {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        will-change: transform;
        opacity: 0;
        transition: transform 140ms cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 180ms ease;
      }

      #raph.show {
        opacity: 1;
      }

      /* The iconic arrow pointer */
      #arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 26px;
        height: 30px;
        filter: drop-shadow(0 0 10px var(--c, #ffb545)) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        transform-origin: top left;
        transition: transform 160ms ease;
      }

      #arrow svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Surrounding celestial aura ring */
      #ring {
        position: absolute;
        left: 12px;
        top: 14px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid var(--c, #ffb545);
        box-shadow: 0 0 16px var(--c, #ffb545), inset 0 0 8px rgba(255,255,255,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      #core {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--c, #ffb545);
        box-shadow: 0 0 10px var(--c, #ffb545);
      }

      /* Status label badge */
      #label {
        position: absolute;
        left: 28px;
        top: 38px;
        font: 700 11px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ffffff;
        background: rgba(15, 17, 21, 0.88);
        border: 1px solid var(--c, #ffb545);
        border-radius: 4px;
        padding: 3px 7px;
        box-shadow: 0 0 12px rgba(0,0,0,0.8), 0 0 8px var(--c, #ffb545);
        white-space: nowrap;
        pointer-events: none;
      }

      /* Ripple on click */
      #ripple {
        position: absolute;
        left: 0;
        top: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 0 12px #ffffff;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        pointer-events: none;
      }

      /* State animations */
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes clickAnim {
        0% { transform: scale(0.85); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      @keyframes rippleEffect {
        0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
      }

      #raph.clicking #arrow {
        animation: clickAnim 0.22s ease;
      }
      #raph.clicking #ripple {
        animation: rippleEffect 0.35s ease-out;
      }
      #raph.executing #ring,
      #raph.moving #ring,
      #raph.targeting #ring {
        animation: pulse 1s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="raph">
      <div id="ripple"></div>
      <div id="arrow">
        <svg viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer glow stroke -->
          <path d="M2 2L21 14L12.5 16.5L8 25L2 2Z" fill="var(--c, #ffb545)" stroke="#090b0e" stroke-width="2" stroke-linejoin="round" />
          <path d="M4 5.5L17.5 14L11.5 15.5L8 22L4 5.5Z" fill="#ffffff" fill-opacity="0.35" />
        </svg>
      </div>
      <div id="ring"><div id="core"></div></div>
      <div id="label">RAPHAEL</div>
    </div>
    <script>
      var raph = document.getElementById('raph');
      var label = document.getElementById('label');
      var COLORS = {
        idle: '#9aa3b2',
        thinking: '#5b9bff',
        moving: '#ffb545',
        targeting: '#49c7b4',
        clicking: '#ffffff',
        dragging: '#ffb545',
        executing: '#ffb545',
        success: '#3ecf8e',
        error: '#e5484d'
      };
      var lastState = '';
      if (window.raphaelCursor) {
        window.raphaelCursor.on(function (d) {
          raph.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
          raph.classList.add('show');
          var c = COLORS[d.state] || '#ffb545';
          raph.style.setProperty('--c', c);

          if (d.label) {
            label.textContent = d.label;
          } else if (d.state !== lastState) {
            label.textContent = d.state === 'idle' ? '' : 'RAPHAEL · ' + d.state.toUpperCase();
          }

          if (d.state !== lastState) {
            raph.className = 'show ' + d.state;
            lastState = d.state;
          }
        });
      }
    </script>
  </body>
</html>
