<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
      /* The Raphael cursor marker — distinct from the system pointer (§3). A
         gold ring with a state-colored core, following the real cursor. */
      #raph {
        position: absolute;
        left: 0; top: 0;
        transform: translate(-50%, -50%);
        pointer-events: none;
        will-change: transform;
        opacity: 0;
        transition: opacity 180ms ease;
      }
      #ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 2px solid var(--c, #ffb545);
        box-shadow: 0 0 14px var(--c, #ffb545), inset 0 0 8px rgba(255,255,255,0.15);
        display: flex; align-items: center; justify-content: center;
        transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }
      #core {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--c, #ffb545);
        box-shadow: 0 0 8px var(--c, #ffb545);
      }
      #label {
        position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
        font: 600 10px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--c, #ffb545);
        text-shadow: 0 0 6px rgba(0,0,0,0.9); white-space: nowrap;
      }
      /* state pulses */
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @keyframes click { 0% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(0.8); } }
      #raph.show { opacity: 1; }
      #raph.clicking #ring { animation: click 0.22s ease; }
      #raph.executing #ring, #raph.moving #ring, #raph.targeting #ring { animation: pulse 1.1s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="raph">
      <div id="ring"><div id="core"></div></div>
      <div id="label"></div>
    </div>
    <script>
      var raph = document.getElementById('raph');
      var label = document.getElementById('label');
      var COLORS = {
        idle: '#9aa3b2', thinking: '#5b9bff', moving: '#ffb545', targeting: '#49c7b4',
        clicking: '#ffffff', dragging: '#ffb545', executing: '#ffb545', success: '#3ecf8e', error: '#e5484d'
      };
      var lastState = '';
      if (window.raphaelCursor) {
        window.raphaelCursor.on(function (d) {
          raph.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px) translate(-50%,-50%)';
          raph.classList.add('show');
          var c = COLORS[d.state] || '#ffb545';
          raph.style.setProperty('--c', c);
          if (d.state !== lastState) {
            raph.className = 'show ' + d.state;
            label.textContent = d.state === 'idle' ? '' : 'RAPHAEL · ' + d.state.toUpperCase();
            lastState = d.state;
          }
        });
      }
    </script>
  </body>
</html>
